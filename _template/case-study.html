<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CASE: [行業名稱] -->
  <title>[行業名稱] — 潤樋科技案例</title>
  <meta name="description" content="[一行描述]">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* STATUS: [Production / Building / Planning] */
    /* HEADLINE METRIC: [e.g., "報價到出貨 2 小時 → 5 分鐘"] */

    .case-detail { padding: 60px 0; }
    .back-link { display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:.9rem;margin-bottom:32px; }
    .back-link:hover { color:var(--blue);text-decoration:none; }
    .case-hero { background:linear-gradient(135deg,var(--navy),#1e3a5f);color:#fff;padding:60px 0 50px; }
    .case-hero-inner { display:flex;align-items:center;gap:20px;flex-wrap:wrap; }
    .case-hero h1 { color:#fff;font-size:2rem; }
    .case-hero .case-badge { font-size:.85rem;padding:4px 16px; }
    .detail-grid { display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:48px; }
    .detail-block h2 { font-size:1.3rem;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--blue); }
    .detail-block p, .detail-block li { color:var(--text-secondary);font-size:.95rem;line-height:1.8; }
    .detail-block ul { list-style:none;padding:0; }
    .detail-block li { padding:6px 0;display:flex;align-items:flex-start;gap:10px; }
    .detail-block li::before { content:'';width:6px;height:6px;background:var(--blue);border-radius:50%;flex-shrink:0;margin-top:10px; }
    .metrics-row { display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:48px; }
    .metric-box { text-align:center;padding:28px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius); }
    .metric-box .metric { display:block;margin-bottom:4px; }
    .metric-box span { color:var(--text-secondary);font-size:.85rem; }
    .highlight-box { background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe;border-radius:var(--radius);padding:32px;margin-bottom:48px; }
    .highlight-box h3 { color:var(--blue);margin-bottom:12px; }
    .highlight-box p { color:var(--text-secondary);font-size:.95rem; }

    @media(max-width:768px) {
      .detail-grid { grid-template-columns:1fr; }
      .metrics-row { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="../index.html" class="logo" style="text-decoration:none">
      <div class="logo-icon">R</div>
      潤樋科技
    </a>
    <nav class="nav">
      <a href="../index.html#cases">所有案例</a>
      <a href="../index.html#contact" class="btn-cta" style="padding:8px 18px;font-size:.85rem">LINE 諮詢</a>
    </nav>
    <button class="hamburger" aria-label="Menu">☰</button>
  </div>
</header>

<section class="case-hero">
  <div class="container">
    <div class="case-hero-inner">
      <!-- [ICON: replace SVG] -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
      <div>
        <h1>[行業名稱]</h1>
        <!-- badge-live or badge-building -->
        <span class="case-badge badge-building">[狀態]</span>
      </div>
    </div>
  </div>
</section>

<section class="case-detail">
  <div class="container">
    <a href="../index.html#cases" class="back-link">&#8592; 返回所有案例</a>

    <div class="metrics-row">
      <div class="metric-box">
        <span class="metric">[數字]</span>
        <span>[說明]</span>
      </div>
      <div class="metric-box">
        <span class="metric">[數字]</span>
        <span>[說明]</span>
      </div>
      <div class="metric-box">
        <span class="metric">[數字]</span>
        <span>[說明]</span>
      </div>
      <div class="metric-box">
        <span class="metric">[數字]</span>
        <span>[說明]</span>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-block">
        <h2>挑戰</h2>
        <ul>
          <li>[挑戰 1]</li>
          <li>[挑戰 2]</li>
          <li>[挑戰 3]</li>
        </ul>
      </div>
      <div class="detail-block">
        <h2>解決方案</h2>
        <ul>
          <li>[方案 1]</li>
          <li>[方案 2]</li>
          <li>[方案 3]</li>
        </ul>
      </div>
    </div>

    <div class="highlight-box">
      <h3>[技術亮點標題]</h3>
      <p>[技術亮點描述]</p>
    </div>

    <div style="text-align:center;padding:20px 0">
      <a href="../index.html#contact" class="btn-cta" style="font-size:1rem;padding:14px 36px">想了解更多？LINE 諮詢</a>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">&copy; 2026 潤樋科技. All rights reserved.</div>
</footer>

<script src="../script.js"></script>
</body>
</html>
